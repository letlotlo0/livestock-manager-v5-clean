<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/png" href="assets/livestock-logo.png">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="Livestock Manager"><title>Create Account | Livestock Manager</title>
<link rel="stylesheet" href="register.css"><link rel="stylesheet" href="premium-ui.css"><link rel="stylesheet" href="final-intelligence.css">
<link rel="stylesheet" href="v51-auth.css?v=5.1.0"></head><body><main class="register-page"><section class="register-card">
<div class="brand"><div class="brand-icon"><img src="assets/livestock-logo.svg" width="60" height="60" alt="Livestock Manager logo"></div><h1>Livestock Manager</h1><p>Create your farmer account</p></div>
<form id="registerForm" autocomplete="on">
<div class="form-group"><label for="fullName">Full name</label><input type="text" id="fullName" name="name" autocomplete="name" minlength="2" maxlength="120" placeholder="Enter your full name" required></div>
<div class="form-group"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required></div>
<div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required><small>Use at least 12 characters. A long passphrase is a good choice.</small></div>
<div class="form-group"><label for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Enter the password again" required></div>
<div class="message" id="message" role="status" aria-live="polite"></div>
<button type="submit" class="register-button">Create Account</button>
</form><div class="login-link">Already have an account? <a href="login.html">Log in</a></div>
</section></main>
<script src="auth-api.js"></script>
<script src="register.js"></script><script src="final-intelligence.js"></script></body></html>
