<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="assets/livestock-logo.png">
    <meta name="application-name" content="Livestock Manager">
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Livestock Manager</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="premium-ui.css">
<link rel="stylesheet" href="final-intelligence.css">
<link rel="stylesheet" href="v51-auth.css?v=5.1.0"></head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">
                <img src="assets/livestock-logo.svg" width="58" height="58" alt="Livestock Manager logo">
            </div>

            <p id="modeBanner" style="font-weight:700;color:#637353;font-size:13px;letter-spacing:.02em">Account availability is being checked…</p>
            <h1>Welcome Back</h1>

            <p class="login-subtitle" id="loginSubtitle">
                Sign in to manage your livestock and farm records securely.
            </p>


            <form id="loginForm" autocomplete="on">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <div
                    role="status" aria-live="polite"
                    id="loginMessage"
                    class="login-message"
                ></div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="login-footer" id="loginFooter"><p>Having trouble signing in? <a href="support.html">Contact Support</a></p></div>

        </section>

    </main>

    





<script src="auth-api.js"></script>
<script src="login.js"></script>
<script src="final-intelligence.js"></script>
</body>
</html>
